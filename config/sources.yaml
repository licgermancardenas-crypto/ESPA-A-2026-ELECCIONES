# ATLAS SPAIN — DATA SOURCE REGISTRY (fuente de verdad)
#
# Este archivo es el catálogo maestro. DATA_SOURCE_REGISTRY.csv se GENERA con
#   atlas registry verify
# que consulta cada `probe_url` y registra estado HTTP, tipo de contenido y fecha.
# Los campos `estado` y `ultima_verificacion` del CSV NO se escriben a mano.
# `ultima_extraccion` sale del log de ejecuciones (ops.executions).
#
# Licencias: se indica la condición publicada por cada organismo. Antes de
# redistribuir datos derivados, revisar el aviso legal vigente de la fuente.

defaults: &lic_ine
  licencia: "Reutilización libre con cita de la fuente (aviso legal INE; Ley 37/2007)"
  restricciones: "Citar 'Fuente: INE'. No implicar respaldo del INE."

