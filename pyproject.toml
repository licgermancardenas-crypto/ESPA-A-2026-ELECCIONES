[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-spain"
version = "0.1.0"
description = "ATLAS SPAIN - plataforma de inteligencia política, electoral y territorial de España"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1",
  "pandas>=2.2",
  "pyarrow>=15",
  "openpyxl>=3.1",
  "requests>=2.31",
  "pyyaml>=6",
  "geopandas>=1.0",
  "shapely>=2.0",
  "pyproj>=3.6",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "dbt-duckdb>=1.8"]
ml = ["scikit-learn>=1.4", "statsmodels>=0.14", "xgboost>=2.0", "h3>=4.0"]

[project.scripts]
atlas = "atlas_spain.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["network: tests que acceden a internet (se omiten por defecto)"]
addopts = "-m 'not network'"
